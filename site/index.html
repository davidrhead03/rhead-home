<!doctype html><html><head><meta charset=utf8><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rhead Home"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F7F2EA"><link rel="icon" href="/icons/icon-192.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rhead Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling column (max 560px), fixed bottom tab bar */
:root{
  --bg:#F6F1EE; --surface:#FFFFFF; --surface2:#F1E8E3; --ink:#2A201C; --muted:#78675F; --line:#E7DBD5;
  --cocoa:#7B4B2F; --cocoa-ink:#FFFFFF; --cocoa-soft:#F1E1D6;
  --blush:#D9776E; --blush-soft:#FBE4E0; --sage:#4F8761; --sage-soft:#E0EEE4; --gold:#B87A1E; --gold-soft:#F7EAD2; --danger:#B83E34;
  --sky:#3F78AE; --sky-soft:#E1ECF6;
  --hl-y:#FFF0A6; --hl-g:#D4F0CF; --hl-b:#D5E7FA; --hl-p:#FBD7E3;
  --shadow:0 1px 2px rgba(70,35,20,.06),0 6px 18px rgba(70,35,20,.07);
  --display:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181312; --surface:#231C1A; --surface2:#2D2421; --ink:#F4EAE5; --muted:#B4A39B; --line:#3A2F2B;
  --cocoa:#D99D72; --cocoa-ink:#1C1311; --cocoa-soft:#3A2A21;
  --blush:#EF9D94; --blush-soft:#3F2725; --sage:#8DC39E; --sage-soft:#20342A; --gold:#E2AE55; --gold-soft:#3A2F1C; --danger:#F07C70;
  --sky:#8DB9E2; --sky-soft:#1E2B38;
  --hl-y:#5A4D16; --hl-g:#1F4428; --hl-b:#1D3655; --hl-p:#542536;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#181312; --surface:#231C1A; --surface2:#2D2421; --ink:#F4EAE5; --muted:#B4A39B; --line:#3A2F2B;
  --cocoa:#D99D72; --cocoa-ink:#1C1311; --cocoa-soft:#3A2A21;
  --blush:#EF9D94; --blush-soft:#3F2725; --sage:#8DC39E; --sage-soft:#20342A; --gold:#E2AE55; --gold-soft:#3A2F1C; --danger:#F07C70;
  --sky:#8DB9E2; --sky-soft:#1E2B38;
  --hl-y:#5A4D16; --hl-g:#1F4428; --hl-b:#1D3655; --hl-p:#542536;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:8px;padding-block:12px 10px}
.brand{flex:1;min-width:0}
.logo{position:relative;width:44px;height:44px;border-radius:14px;border:0;padding:0;cursor:pointer;flex:none;display:grid;place-items:center;background:linear-gradient(150deg,#F3C9B8 0%,#E58E80 100%);box-shadow:0 2px 6px rgba(120,60,40,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.logo-heart{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--surface);color:var(--blush);font-size:10px;line-height:17px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.brand h1{font-size:22px;color:var(--cocoa);line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.duo{display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer}
.duo .av{border:2.5px solid var(--bg);border-radius:50%}
.duo .av+.av{margin-left:-10px}
main{padding-block:4px 120px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:19px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 140px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;outline:none;min-width:0}
textarea{resize:vertical;min-height:80px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--cocoa);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--cocoa);border-color:var(--cocoa);color:var(--cocoa-ink)}
.btn.soft{background:var(--cocoa-soft);border-color:transparent;color:var(--cocoa)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface2)}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14.5px;white-space:nowrap;min-width:0}
.seg.scroll{overflow-x:auto;scrollbar-width:none}.seg.scroll::-webkit-scrollbar{display:none}.seg.scroll button{flex:1 0 auto;padding:8px 12px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.li .sub{font-size:13px;color:var(--muted)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;cursor:pointer;color:transparent}
.check.on{background:var(--sage);border-color:var(--sage);color:var(--surface)}
.done .txt{text-decoration:line-through;color:var(--muted)}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.sage{background:var(--sage-soft);color:var(--sage)}
.pill.blush{background:var(--blush-soft);color:var(--blush)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.cocoa{background:var(--cocoa-soft);color:var(--cocoa)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}
.num{font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:999px}
.bar.warn i{background:var(--gold)!important}
.bar.over i{background:var(--danger)!important}

/* Dayla */
.dayla{background:var(--cocoa-soft);border:0;position:relative;overflow:hidden;padding:18px 16px 14px}
.dayla .top{display:flex;gap:12px;align-items:flex-start}
.dayla svg.dog{width:92px;height:92px;flex:none}
.dphoto{border:0;padding:0;cursor:pointer;position:relative;width:92px;height:92px;flex:none;border-radius:50%;overflow:hidden;background:var(--surface);box-shadow:0 0 0 3px var(--surface),0 4px 12px rgba(80,40,25,.18)}
.dphoto svg.dog{width:100%;height:100%}
.dphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bubble{background:var(--surface);border-radius:18px 18px 18px 6px;padding:12px 14px;flex:1;min-width:0;position:relative}
.bubble .hi{font-family:var(--display);font-weight:600;font-size:18px;color:var(--cocoa)}
.bubble p{margin:4px 0 0}
.saying{margin:12px 2px 0;font-family:var(--display);font-weight:500;font-size:17.5px;line-height:1.35;color:var(--ink);text-wrap:pretty}
.dayla .foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--cocoa);font-size:13px;font-weight:600}
.paw{display:inline-block;transform:rotate(-12deg)}

/* Weather */
.wx-now{display:flex;align-items:center;gap:14px}
.wx-now .t{font-family:var(--display);font-weight:600;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.wx-now .t small{font-size:20px;color:var(--muted);font-weight:500}
.wx-days{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.wx-days::-webkit-scrollbar{display:none}
.wx-d{flex:none;width:62px;background:var(--surface2);border-radius:14px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.wx-d b{font-size:13px}
.wx-d span{font-size:12px;color:var(--muted)}
.wx-d .pop{color:var(--sky);font-weight:600}

.married{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.married .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--blush);font-variant-numeric:tabular-nums}
.ring{width:84px;height:84px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:12.5px;color:var(--muted)}
.verse{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.4;margin:6px 0 4px;text-wrap:pretty}
.verse-es{font-style:italic;color:var(--ink);opacity:.85;margin:10px 0 2px;text-wrap:pretty}

/* Places grid */
.roomgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.roomtile{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0;background:var(--surface);cursor:pointer;aspect-ratio:1/1;max-width:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:inherit;box-shadow:var(--shadow)}
.roomtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.roomph{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:40px;color:var(--gold);background:var(--gold-soft)}
.roomname,.roommeta{position:relative;z-index:1;background:var(--surface);padding:0 12px}
.roomname{padding-top:8px;font-weight:700;font-size:15px}
.roommeta{font-size:12px;color:var(--muted);padding-bottom:10px}
.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gbtn{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-weight:600;font-size:12.5px;line-height:1.2;text-align:center;position:relative;min-width:0}
.gbtn .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.gbtn .ic svg{width:24px;height:24px}
.gbtn .badge{top:6px;left:auto;right:8px}

/* Chat */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .b{background:var(--surface);border:1px solid var(--line);padding:9px 13px;border-radius:18px 18px 18px 6px;overflow-wrap:anywhere;min-width:0}
.msg.mine .b{background:var(--cocoa);color:var(--cocoa-ink);border-color:var(--cocoa);border-radius:18px 18px 6px 18px}
.msg time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.daysep{align-self:center;font-size:12px;color:var(--muted);font-weight:600;margin:8px 0 2px}
.composer{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.composer form{display:flex;gap:8px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dow{font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1/1;max-width:100%;border:0;background:transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:500}
.cal button.out{opacity:.35}
.cal button.today{background:var(--cocoa-soft);color:var(--cocoa);font-weight:700}
.cal button.sel{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--blush)}
.dots i.bill{background:var(--gold)}
.dots i.ann{background:var(--danger)}
.dots i.hol{background:var(--sage)}
.dots i.todo{background:var(--sky)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{display:inline-flex;position:relative}
.daypick input{position:absolute;opacity:0;width:1px;height:1px}
.daypick span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-weight:600;cursor:pointer;background:var(--surface)}
.daypick input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daypick input:focus-visible+span{outline:2px solid var(--cocoa);outline-offset:2px}
.weekday h3{font-size:16px;margin-bottom:2px}
.tl{display:flex;flex-direction:column}
.tl .li{gap:10px}
.tcol{flex:none;width:54px;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.kbar{flex:none;width:4px;align-self:stretch;border-radius:4px;background:var(--line);min-height:28px}
.kbar.ev{background:var(--cocoa)}.kbar.sched{background:var(--sky)}.kbar.plan{background:var(--sage)}.kbar.todo{background:var(--sky)}.kbar.hol{background:var(--sage)}.kbar.ann{background:var(--danger)}.kbar.trip{background:var(--gold)}
.dsec{margin-top:12px}
.dsec>.eyebrow{margin-bottom:2px}
.wkhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.wkhead .go{font-size:13px;font-weight:600;color:var(--cocoa);white-space:nowrap}
.schedline{font-size:12.5px;color:var(--muted);margin-top:6px}

/* Wheel */
.wheel-wrap{position:relative;width:min(100%,320px);aspect-ratio:1/1;margin:4px auto 0}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.result{background:var(--blush-soft);border-radius:16px;padding:14px;text-align:center}
.result b{font-family:var(--display);font-size:20px;font-weight:600;display:block;color:var(--ink)}

/* Memories */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.mem img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:var(--surface2);display:block}
.mem.one{grid-template-columns:1fr}
.mem.one img{aspect-ratio:4/3}

/* Avatars */
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--cocoa);outline-offset:2px}
.custom-color{position:relative;width:34px;height:34px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;color:var(--muted);overflow:hidden;cursor:pointer;font-weight:700}
.custom-color input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px}
.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.av-stage{display:flex;flex-direction:column;align-items:center;padding:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:2}

/* Workouts */
.exrow{background:var(--surface2);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:end}
.exrow .name{grid-column:1/-1}
.exrow input{background:var(--surface)}
.exlist{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.exlist li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed var(--line)}
.exlist li:first-child{border-top:0}

/* Calculator */
.calc-screen{background:var(--surface2);border-radius:16px;padding:14px 16px;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.calc-screen .e{color:var(--muted);min-height:20px;font-size:15px}
.calc-screen .v{font-family:var(--display);font-size:36px;font-weight:600}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.keys button{border:0;background:var(--surface2);border-radius:16px;padding:16px 0;font-size:20px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.keys button.op{background:var(--cocoa-soft);color:var(--cocoa)}
.keys button.eq{background:var(--cocoa);color:var(--cocoa-ink)}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{border:0;background:transparent;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--cocoa)}

/* ===== v16 design pass: soft clay depth ===== */

:root[data-theme="dark"]{--shadow:0 1px 1px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7);--lift:inset 0 1px 0 rgba(255,255,255,.06);--glass:rgba(35,28,26,.72);--ic-ink:#1C1311;--glow:rgba(255,255,255,.05)}

  background:radial-gradient(70vmax 50vmax at 0% -10%,var(--blush-soft),transparent 62%),radial-gradient(60vmax 45vmax at 105% 18%,var(--gold-soft),transparent 60%),radial-gradient(60vmax 50vmax at 40% 115%,var(--sage-soft),transparent 60%)}

.parade-i small{font-size:11px;color:var(--muted)}

.occ-emo{font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blush-soft);flex:none}
.kbar.occ{background:var(--blush)}.kbar.car{background:var(--sky)}
.car-rem{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.car-rem>div{background:var(--surface2);border-radius:14px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.car-rem>div>span{font-size:12.5px;color:var(--muted)}
.car-rem b{font-size:14px}
.tr-out{font-family:var(--display);font-size:24px;line-height:1.3;margin:6px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.tr-big{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.tr-big .tr-txt{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:600;font-size:clamp(30px,8vw,56px);line-height:1.2;overflow:auto;overflow-wrap:anywhere;transition:transform .35s ease}
.tr-big.flip .tr-txt{transform:rotate(180deg)}
details.card.more>summary{font-family:var(--display);font-size:17px}
a.btn,a.icon-btn{text-decoration:none;color:inherit}
input[type=tel],input[type=email]{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:10px 12px;font-size:16px;outline:none;min-width:0;box-shadow:inset 0 1px 3px rgba(60,30,15,.09)}
.places .gbtn.more .ic{background:var(--surface2);color:var(--muted);box-shadow:none}
.gbtn.fav-on{box-shadow:0 0 0 2px var(--gold),var(--shadow)}
.gbtn .star{position:absolute;top:4px;right:6px;color:var(--gold);font-size:16px}
.fav-order{display:flex;flex-wrap:wrap;gap:6px}
.fav-chip{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:10px;padding:2px;font-size:13px;font-weight:600}
.fav-chip span{padding:0 4px}
.fav-chip button{border:0;background:var(--surface);border-radius:8px;width:24px;height:26px;font-size:16px;cursor:pointer;color:inherit}
.fav-chip button:disabled{opacity:.3}
.daily{display:flex;flex-direction:column;gap:8px}
.swipe{transition:height .25s ease;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px;align-items:flex-start;margin:0 -2px;padding:2px 2px 8px}
.swipe::-webkit-scrollbar{display:none}
.swipe .slide{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.swipe .slide>*{margin:0}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer;transition:width .2s,background .2s}
.dots button.on{width:20px;border-radius:5px;background:var(--cocoa)}
.fin-top button{flex:1 1 0;min-width:0;padding-left:2px;padding-right:2px;font-size:14px}
.fin-top button:last-child{flex:0 0 44px}
.fin-sub{display:flex;gap:6px;margin-top:-4px}
.fin-sub button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;font:inherit;font-size:14px;font-weight:700;color:inherit;cursor:pointer}
.fin-sub button.on{background:var(--ink);color:var(--bg);border-color:transparent;box-shadow:var(--shadow)}

.cmp-btn{flex:none;width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;color:var(--cocoa);font-size:20px}
.cmp-btn.on{background:var(--blush-soft)}
.composer form{display:flex;gap:6px;align-items:center}
.stk-tray{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(142px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;z-index:7;background:var(--surface);border-radius:22px;box-shadow:0 12px 30px -10px rgba(0,0,0,.35);padding:12px;max-height:44vh;overflow-y:auto}
.stk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.stk-grid button{border:0;background:var(--surface2);border-radius:16px;padding:4px;cursor:pointer;display:grid;place-items:center}
.stk-grid svg{width:100%;height:auto;max-width:84px}
.msg .b.stk-b{background:none!important;box-shadow:none!important;border:0!important;padding:0}
.msg .b.stk-b time{display:block;text-align:center}
.msg .b.img-b{padding:4px}
.msg-img{border:0;padding:0;background:none;cursor:pointer;display:block}
.msg-img img{display:block;max-width:220px;max-height:280px;width:auto;height:auto;border-radius:14px}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px;cursor:pointer}
.lightbox img{max-width:100%;max-height:90vh;border-radius:12px}
.gts-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gts-opts .triv-a{font-size:14px;padding:12px 10px}
.triv-a[aria-disabled="true"]{opacity:.85}
.pgrp{display:flex;flex-direction:column;gap:6px}
.pgrp+.pgrp{margin-top:6px}
.pgrp>.eyebrow{margin:0 4px;font-size:11px;letter-spacing:.08em}
.places.g4{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.places.g4 .gbtn{padding:10px 2px 8px;border-radius:18px;font-size:11.5px;gap:6px}
.places.g4 .gbtn .ic{width:42px;height:42px;border-radius:14px}
.places.g4 .gbtn .ic svg{width:22px;height:22px}
.search-pill{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:12px 16px;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.search-pill svg{color:var(--cocoa)}
.fab{position:fixed;right:max(18px,calc(50% - 268px + 18px));bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;background:linear-gradient(180deg,#D9785F,#B5523B);box-shadow:0 10px 22px rgba(181,82,59,.38),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.15);transition:transform .15s}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab svg{width:28px;height:28px;stroke-width:2.6}
.qa-pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qa-pick button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-weight:600;font-size:11.5px;color:inherit;cursor:pointer}
.qa-pick button span{font-size:24px}
.qa-pick button.on{background:var(--ink,#2A201C);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.passport{background:linear-gradient(160deg,#F7EBDD,#EFDCC5);border:2px solid #C9A77F;position:relative}
.pp-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed #C9A77F;padding-bottom:8px;margin-bottom:12px;color:#7A4A1E;font-size:12px;letter-spacing:.12em;font-weight:700}
.pp-head b{font-family:var(--display);font-size:22px;letter-spacing:.02em}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.stamp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;color:#7A4A1E}
.stamp .st-ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;border:3px dashed rgba(122,74,30,.28);background:rgba(255,255,255,.35)}
.stamp .st-e{font-size:30px;opacity:.35;filter:grayscale(1)}
.stamp b{font-size:12px;line-height:1.2}
.stamp small{font-size:10.5px;opacity:.75;line-height:1.25}
.stamp small.st-date{opacity:1;font-weight:800;color:#2E7D4F}
.stamp.on .st-ring{transform:rotate(var(--rot));border:3px double hsl(var(--hue) 55% 42%);background:radial-gradient(circle,hsl(var(--hue) 70% 92%) 55%,hsl(var(--hue) 60% 82%));box-shadow:0 0 0 3px hsl(var(--hue) 55% 42% / .25),0 4px 10px rgba(0,0,0,.12);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1)}
.stamp.on .st-e{opacity:1;filter:none}
@keyframes stampIn{from{transform:scale(1.6) rotate(-20deg);opacity:0}}
.ach{display:flex;gap:12px;align-items:center}
.ach-e{font-size:30px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surface2);flex:none;filter:grayscale(.85);opacity:.7}
.ach.got .ach-e{filter:none;opacity:1;background:var(--gold-soft)}
.medals{display:flex;gap:4px}
.medal{width:16px;height:16px;border-radius:50%;background:var(--surface2);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.medal.on{background:radial-gradient(circle at 35% 30%,#fff 0,var(--m) 55%);box-shadow:0 0 0 2px color-mix(in srgb,var(--m) 50%,#fff),0 2px 4px rgba(0,0,0,.2)}
.wrap-story{position:relative;border-radius:28px;min-height:480px;padding:34px 22px 28px;color:#fff;background:linear-gradient(155deg,var(--w1),var(--w2));box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;justify-content:center;text-align:center}
.wrap-story::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.12);top:-120px;right:-110px}
.wrap-story::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(0,0,0,.08);bottom:-90px;left:-70px}
.w-prog{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:4px;z-index:3}
.w-prog i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.3)}
.w-prog i.done,.w-prog i.on{background:#fff}
.w-tap{position:absolute;top:0;bottom:0;width:38%;background:none;border:0;z-index:2;cursor:pointer}
.w-tap.l{left:0;width:30%}.w-tap.r{right:0;width:70%}
.w-body{position:relative;z-index:1;pointer-events:none;animation:wIn .45s cubic-bezier(.2,.9,.3,1)}
.w-body button{pointer-events:auto;position:relative;z-index:4}
@keyframes wIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
.w-kick{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.w-title{color:#fff;font-family:var(--display);font-size:34px;line-height:1.1;margin-top:10px}
.w-big{font-family:var(--display);font-size:76px;line-height:1;margin-top:18px;animation:wPop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes wPop{from{transform:scale(.4);opacity:0}}
.w-l{font-size:17px;opacity:.95;margin-top:6px}
.w-p{font-size:16px;line-height:1.45;margin:16px 0 0;opacity:.95}
.w-duo{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px}
.w-vs{display:flex;justify-content:center;gap:28px;margin-top:20px}
.w-vs div{display:flex;flex-direction:column;align-items:center;gap:4px}
.w-vs b{font-size:26px;font-family:var(--display)}
.w-vs span{font-size:13px;opacity:.85}
.w-row{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:18px}
.w-row div{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.16);border-radius:18px;padding:12px 16px;min-width:110px}
.w-row b{font-family:var(--display);font-size:32px}
.w-row span{font-size:13px;opacity:.9}

/* ===== Hearth rebrand: cream, forest green, terracotta; Fraunces + DM Sans ===== */
:root{
  --bg:#F7F2EA; --surface:#FFFDF9; --surface2:#F2EBE0; --ink:#2B2620; --muted:#6B6257; --line:#E6DCCD;
  --cocoa:#2F5D4A; --cocoa-ink:#FFFFFF; --cocoa-soft:#E3EDE6;
  --blush:#B5573A; --blush-soft:#F6E2D9; --sage:#3F7A55; --sage-soft:#E3EFE5; --gold:#9A6B18; --gold-soft:#F3E8CF; --danger:#B3402F;
  --sky:#3D6E9A; --sky-soft:#E2EBF3;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(60,45,25,.05),0 8px 20px -12px rgba(60,45,25,.18); --lift:inset 0 0 0 0 transparent; --glass:rgba(247,242,234,.88); --ic-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14120F; --surface:#1E1B17; --surface2:#29251F; --ink:#F1EBE1; --muted:#B2A797; --line:#353027;
  --cocoa:#8FC2A5; --cocoa-ink:#10201A; --cocoa-soft:#21342B;
  --blush:#E5A084; --blush-soft:#3A2620; --sage:#8FC2A5; --sage-soft:#1F3328; --gold:#E0B566; --gold-soft:#3A311F; --danger:#EE8577;
  --sky:#93BCE0; --sky-soft:#1D2A36; --glass:rgba(20,18,15,.88); --shadow:0 1px 2px rgba(0,0,0,.35); --ic-ink:#10201A;
}}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#1E1B17; --surface2:#29251F; --ink:#F1EBE1; --muted:#B2A797; --line:#353027;
  --cocoa:#8FC2A5; --cocoa-ink:#10201A; --cocoa-soft:#21342B;
  --blush:#E5A084; --blush-soft:#3A2620; --sage:#8FC2A5; --sage-soft:#1F3328; --gold:#E0B566; --gold-soft:#3A311F; --danger:#EE8577;
  --sky:#93BCE0; --sky-soft:#1D2A36; --glass:rgba(20,18,15,.88); --shadow:0 1px 2px rgba(0,0,0,.35); --ic-ink:#10201A;
}
html::before{background:none}
h1,h2,h3{font-weight:600;letter-spacing:-.005em}
.brand h1{color:var(--ink);font-size:23px;letter-spacing:-.01em}
.brand h1 em{font-style:italic;font-weight:500;color:var(--blush)}
.logo{background:var(--cocoa);box-shadow:0 0 0 2.5px var(--surface),0 4px 10px -4px rgba(47,93,74,.45)}
.logo-heart{color:var(--blush)}
.card{box-shadow:var(--shadow)}
.tile{box-shadow:var(--shadow)}
.btn{box-shadow:none}
.btn:active{transform:scale(.98);box-shadow:none}
.btn.primary{background:var(--cocoa);border-color:var(--cocoa);color:var(--cocoa-ink);box-shadow:none}
.btn.primary:active{transform:scale(.98);box-shadow:none}
nav.tabs button.on{color:var(--cocoa)}
nav.tabs button.on::before{background:var(--cocoa-soft);box-shadow:none}
nav.tabs button.on svg{color:var(--cocoa)}
.chip.on{background:var(--cocoa);border-color:var(--cocoa);color:var(--cocoa-ink)}
.check.on{background:var(--cocoa);border-color:var(--cocoa)}
.dayla{background:var(--gold-soft)}

/* Hearth: logo mark + welcome */
.logo.logo-mark{background:var(--cocoa);display:grid;place-items:center}
.logo-r{font-family:var(--display);font-weight:600;font-size:25px;line-height:1;color:var(--cocoa-ink);transform:translateY(-1px)}
.overlay{background:var(--bg)}
.welcome .w-mark{width:84px;height:84px;margin:0 auto;border-radius:26px;background:var(--cocoa);color:var(--cocoa-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:48px;line-height:1;box-shadow:0 10px 24px -12px rgba(47,93,74,.6)}
.welcome .w-eyebrow{margin-top:22px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blush)}
.welcome .w-title{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.05;margin:6px 0 0;color:var(--ink);letter-spacing:-.01em}
.welcome .w-title em{font-style:italic;font-weight:500;color:var(--blush)}
.welcome .w-sub{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.welcome .w-q{font-family:var(--display);font-weight:600;font-size:19px;margin-top:28px;color:var(--ink)}
.welcome .who button{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.welcome .who button:hover,.welcome .who button:focus-visible{border-color:var(--cocoa)}

/* Hearth: verse card + flat app icons */
.verse-card{background:var(--cocoa)!important;border-color:transparent!important;color:var(--cocoa-ink)}
.verse-card .eyebrow{color:var(--cocoa-ink);opacity:.85;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.verse-card .verse{color:var(--cocoa-ink);font-size:19px}
.verse-card .verse-es{color:var(--cocoa-ink);opacity:.9}
.verse-card .muted{color:var(--cocoa-ink);opacity:.82}
.verse-card .icon-btn{color:var(--cocoa-ink)!important}
.verse-card .btn.soft{background:rgba(255,255,255,.16);color:var(--cocoa-ink)}
.verse-card .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:var(--cocoa-ink)}
.gbtn .ic{background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);box-shadow:none}
.gbtn .ic svg{filter:none}

/* Avatar builder (Mii-inspired) */
.avb-stage{padding:12px;gap:10px;display:flex;flex-direction:column;align-items:stretch}
.avb-plaza{position:relative;border-radius:20px;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--avbg) 100%,#fff 0%) 0%,color-mix(in srgb,var(--avbg) 55%,var(--surface)) 100%);display:flex;justify-content:center;align-items:flex-end;min-height:210px;padding:46px 8px 8px;overflow:hidden}
.avb-plaza::after{content:"";position:absolute;left:50%;bottom:10px;width:150px;height:22px;margin-left:-75px;border-radius:50%;background:rgba(255,255,255,.55);z-index:0}
.avb-plaza #av-preview{position:relative;z-index:1;line-height:0}
.avb-plaza #av-preview svg{display:block;border-radius:0;animation:avBob 2.6s ease-in-out infinite}
.avb-plaza #av-preview svg.av:not(.av-full){border-radius:50%;box-shadow:0 0 0 5px var(--surface)}
.avb-view{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:3px;background:color-mix(in srgb,var(--surface) 85%,transparent);z-index:2}
.avb-view button{padding:6px 14px;font-size:13px}
.avb-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.avb-cats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.avb-cats::-webkit-scrollbar{display:none}
.avb-cats button{flex:none;min-width:70px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.avb-cats button.on{background:var(--cocoa);border-color:var(--cocoa);color:var(--cocoa-ink)}
.avb-panel{display:flex;flex-direction:column;gap:18px}
.avb-sec{display:flex;flex-direction:column;gap:9px}
.avb-h{font-family:var(--display);font-weight:600;font-size:16px}
.avb-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.avb-tiles.full{grid-template-columns:repeat(3,minmax(0,1fr))}
.avb-tile{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.avb-th{width:100%;display:grid;place-items:center;line-height:0}
.avb-th svg{width:100%;max-width:64px;height:auto;border-radius:50%}
.avb-tiles.full .avb-th svg{max-width:72px;border-radius:12px}
.avb-lbl{font-size:11.5px;font-weight:600;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.avb-tile.on{border-color:var(--cocoa);background:var(--cocoa-soft);box-shadow:0 0 0 2px var(--cocoa)}
.avb-tile.on .avb-lbl{color:var(--cocoa)}
.avb-sw{display:flex;flex-wrap:wrap;gap:10px}
.avb-sw button,.avb-custom{width:38px;height:38px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.avb-sw button.on{box-shadow:0 0 0 2.5px var(--cocoa)}
.avb-custom{display:grid;place-items:center;font-weight:700;color:var(--muted);background:var(--surface2);position:relative;overflow:hidden}
.avb-custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.avb-seg button{font-size:13.5px}
.avb-seg{flex-wrap:nowrap}
.avb-plaza.full{min-height:0;padding-top:42px}
.avb-plaza.face #av-preview svg{border-radius:50%;box-shadow:0 0 0 5px var(--surface)}
.avb-tiles.full.cropped .avb-th svg{max-width:76px;border-radius:12px;background:var(--surface2)}
.avb-tile .avb-th svg.av:not(.av-full){border-radius:50%}
.avb-none{display:grid;place-items:center;font-weight:700;color:var(--muted);background:var(--surface2)!important;font-size:16px}
.avb-sw button.avb-none.on{box-shadow:0 0 0 2.5px var(--cocoa)}

/* ---------- seasonal decorations ---------- */
#deco{position:absolute;left:0;right:0;bottom:-11px;height:18px;pointer-events:none;z-index:1}
#deco svg{display:block;width:100%;height:18px}
#deco .tw{animation:twinkle 2.4s ease-in-out infinite}
#deco .tw:nth-child(3n){animation-delay:.8s}#deco .tw:nth-child(3n+1){animation-delay:1.6s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
#season{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#season i{position:absolute;top:-30px;font-style:normal;line-height:1;will-change:transform;animation:sFall var(--d) linear var(--dl) infinite}
#season i b{display:block;font-weight:400;animation:sSway calc(var(--d) / 4) ease-in-out infinite alternate}
@keyframes sFall{to{transform:translateY(calc(100vh + 60px)) rotate(var(--r))}}
@keyframes sSway{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sbadge{position:absolute;right:-6px;bottom:-4px;font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));animation:sBadge 3s ease-in-out infinite;pointer-events:none}
@keyframes sBadge{50%{transform:rotate(-10deg) scale(1.08)}}
/* ---------- juice ---------- */
#main.enter>*{animation:cardIn .46s cubic-bezier(.2,.9,.3,1.12) both}
#main.enter>*:nth-child(2){animation-delay:.04s}#main.enter>*:nth-child(3){animation-delay:.08s}#main.enter>*:nth-child(4){animation-delay:.12s}
#main.enter>*:nth-child(5){animation-delay:.16s}#main.enter>*:nth-child(6){animation-delay:.2s}#main.enter>*:nth-child(7){animation-delay:.24s}#main.enter>*:nth-child(n+8){animation-delay:.28s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
#main.enter .bar i{animation:barIn .9s cubic-bezier(.2,.8,.2,1) .18s both}
@keyframes barIn{from{width:0}}

.spark{position:fixed;left:0;top:0;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:40;animation:spark .65s cubic-bezier(.15,.7,.3,1) forwards}

.seg button{transition:background .2s,color .2s,transform .15s}

.li.done .txt{transition:opacity .3s}

 [45, 12, 12, "Rejoicing in hope; patient in tribulation; continuing instant in prayer;", "Gozosos en la esperanza; sufridos en la tribulación; constantes en la oración;"],
 [20, 16, 3, "Commit thy works unto the Lord, and thy thoughts shall be established.", "Encomienda á Jehová tus obras, y tus pensamientos serán afirmados."],
 [21, 4, 12, "And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken.", "Y si alguno prevaleciere contra el uno, dos estarán contra él; y cordón de tres dobleces no presto se rompe."],
 [19, 127, 1, "A Song of degrees for Solomon. Except the Lord build the house, they labour in vain that build it: except the Lord keep the city, the watchman waketh but in vain.", "Cántico gradual: para Salomón. SI Jehová no edificare la casa, en vano trabajan los que la edifican: si Jehová no guardare la ciudad, en vano vela la guarda."],
 [20, 24, 3, "Through wisdom is an house builded; and by understanding it is established:", "Con sabiduría se edificará la casa, y con prudencia se afirmará:"],
 [19, 55, 22, "Cast thy burden upon the Lord, and he shall sustain thee: he shall never suffer the righteous to be moved.", "Echa sobre Jehová tu carga, y él te sustentará; no dejará para siempre caído al justo."],
 [62, 4, 19, "We love him, because he first loved us.", "Nosotros le amamos á él, porque él nos amó primero."],
 [59, 1, 17, "Every good gift and every perfect gift is from above, and cometh down from the Father of lights, with whom is no variableness, neither shadow of turning.", "Toda buena dádiva y todo don perfecto es de lo alto, que desciende del Padre de las luces, en el cual no hay mudanza, ni sombra de variación."],
 [19, 37, 4, "Delight thyself also in the Lord; and he shall give thee the desires of thine heart.", "Pon asimismo tu delicia en Jehová, y él te dará las peticiones de tu corazón."],
 [46, 13, 4, "Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,", "La caridad es sufrida, es benigna; la caridad no tiene envidia, la caridad no hace sinrazón, no se ensancha;"],
 [48, 6, 2, "Bear ye one another’s burdens, and so fulfil the law of Christ.", "Sobrellevad los unos las cargas de los otros; y cumplid así la ley de Cristo."],
 [16, 8, 10, "Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the Lord is your strength.", "Díjoles luego: Id, comed grosuras, y bebed vino dulce, y enviad porciones á los que no tienen prevenido; porque día santo es á nuestro Señor: y no os entristezcáis, porque el gozo de Jehová es vuestra fortaleza."],
 [51, 3, 23, "And whatsoever ye do, do it heartily, as to the Lord, and not unto men;", "Y todo lo que hagáis, hacedlo de ánimo, como al Señor, y no á los hombres;"],
 [52, 5, 17, "Pray without ceasing.", "Orad sin cesar."],
 [19, 107, 1, "O give thanks unto the Lord, for he is good: for his mercy endureth for ever.", "ALABAD á Jehová, porque es bueno; porque para siempre es su misericordia."],
 [47, 12, 9, "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.", "Y me ha dicho: Bástate mi gracia; porque mi potencia en la flaqueza se perfecciona. Por tanto, de buena gana me gloriaré más bien en mis flaquezas, porque habite en mí la potencia de Cristo."],
 [49, 4, 32, "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.", "Antes sed los unos con los otros benignos, misericordiosos, perdonándoos los unos á los otros, como también Dios os perdonó en Cristo."],
 [20, 3, 6, "In all thy ways acknowledge him, and he shall direct thy paths.", "Reconócelo en todos tus caminos, y él enderezará tus veredas."],
 [6, 1, 9, "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the Lord thy God is with thee whithersoever thou goest.", "Mira que te mando que te esfuerces y seas valiente: no temas ni desmayes, porque Jehová tu Dios será contigo en donde quiera que fueres."],
 [43, 3, 16, "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", "Porque de tal manera amó Dios al mundo, que ha dado á su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna."],
 [25, 3, 23, "They are new every morning: great is thy faithfulness.", "Nuevas son cada mañana; grande es tu fidelidad."],
 [23, 40, 31, "But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.", "Mas los que esperan á Jehová tendrán nuevas fuerzas; levantarán las alas como águilas; correrán, y no se cansarán; caminarán, y no se fatigarán."],
 [24, 29, 11, "For I know the thoughts that I think toward you, saith the Lord, thoughts of peace, and not of evil, to give you an expected end.", "Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis."],
 [40, 11, 28, "Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "Venid á mí todos los que estáis trabajados y cargados, que yo os haré descansar."],
 [45, 8, 28, "And we know that all things work together for good to them that love God, to them who are the called according to his purpose.", "Y sabemos que á los que á Dios aman, todas las cosas les ayudan á bien, es á saber, á los que conforme al propósito son llamados."],
 [50, 4, 6, "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.", "Por nada estéis afanosos; sino sean notorias vuestras peticiones delante de Dios en toda oración y ruego, con hacimiento de gracias."],
 [19, 34, 8, "O taste and see that the Lord is good: blessed is the man that trusteth in him.", "Gustad, y ved que es bueno Jehová: dichoso el hombre que confiará en él."],
 [33, 6, 8, "He hath shewed thee, O man, what is good; and what doth the Lord require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?", "Oh hombre, él te ha declarado qué sea lo bueno, y qué pida de ti Jehová: solamente hacer juicio, y amar misericordia, y humillarte para andar con tu Dios."],
 [58, 11, 1, "Now faith is the substance of things hoped for, the evidence of things not seen.", "ES pues la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven."],
 [60, 5, 7, "Casting all your care upon him; for he careth for you.", "Echando toda vuestra solicitud en él, porque él tiene cuidado de vosotros."],
 [36, 3, 17, "The Lord thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.", "Jehová en medio de ti, poderoso, él salvará; gozaráse sobre ti con alegría, callará de amor, se regocijará sobre ti con cantar."],
 [19, 16, 11, "Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore.", "Me mostrarás la senda de la vida: hartura de alegrías hay con tu rostro; deleites en tu diestra para siempre."],
 [20, 17, 17, "A friend loveth at all times, and a brother is born for adversity.", "En todo tiempo ama el amigo; y el hermano para la angustia es nacido."],
 [8, 1, 16, "And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:", "Y Ruth respondió: No me ruegues que te deje, y me aparte de ti: porque donde quiera que tú fueres, iré yo; y donde quiera que vivieres, viviré. Tu pueblo será mi pueblo, y tu Dios mi Dios."],
 [40, 5, 16, "Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.", "Así alumbre vuestra luz delante de los hombres, para que vean vuestras obras buenas, y glorifiquen á vuestro Padre que está en los cielos."],
 [19, 90, 12, "So teach us to number our days, that we may apply our hearts unto wisdom.", "Enséñanos de tal modo á contar nuestros días, que traigamos al corazón sabiduría."],
 [19, 121, 2, "My help cometh from the Lord, which made heaven and earth.", "Mi socorro viene de Jehová, que hizo los cielos y la tierra."],
 [46, 13, 13, "And now abideth faith, hope, charity, these three; but the greatest of these is charity.", "Y ahora permanecen la fe, la esperanza, y la caridad, estas tres: empero la mayor de ellas es la caridad."],
 [19, 118, 1, "O give thanks unto the Lord; for he is good: because his mercy endureth for ever.", "ALABAD á Jehová, porque es bueno; porque para siempre es su misericordia."],
 [20, 15, 1, "A soft answer turneth away wrath: but grievous words stir up anger.", "LA blanda respuesta quita la ira: mas la palabra áspera hace subir el furor."]

function makeDb(sb){

    if(q.order){ const { f, dir } = q.order; arr.sort((x, y) => { const p = Number(x.data[f]) || 0, r = Number(y.data[f]) || 0; return dir === 'desc' ? r - p : p - r; }); }
    if(q.lim) arr = arr.slice(0, q.lim); return arr; };
  const snap = arr => ({ docs: arr.map(r => ({ id: r.id, data: () => r.data })) });
  const emit = col => (subs[col] || []).forEach(x => { try{ x.fn(snap(rowsOf(col, x.q))); }catch(e){ console.warn(e); } });
  async function loadAll(){
    if(loading) return loading;
    loading = (async () => {
      const fresh = {}; let from = 0;
      for(;;){
        const { data, error } = await sb.from('docs').select('col,id,data').order('col').order('id').range(from, from + 999);
        if(error) throw error;

        if(data.length < 1000) break; from += 1000;

    async update(patch){ const p = JSON.parse(JSON.stringify(patch || {})), cur = (cache[col] && cache[col].get(id)) || {}; (cache[col] = cache[col] || new Map()).set(id, Object.assign({}, cur, p)); emit(col);

}

async function refreshWeather(){

    const fc = await (await fetch(pt.properties.forecast)).json();
    const days = {}, short = c => String(c || '').replace(/Showers And Thunderstorms/i, 'Showers and storms').replace(/\s+then\s+.*/i, '').slice(0, 40);
    const icon = c => /thunder|storm/i.test(c) ? 'storm' : /rain|shower|drizzle/i.test(c) ? 'rain' : /partly|mostly sunny|mostly cloudy/i.test(c) ? 'partly' : /sunny|clear/i.test(c) ? 'sun' : /cloud/i.test(c) ? 'cloud' : 'partly';

      else { e.lo = x.temperature; if(!e.cond){ e.cond = short(x.shortForecast); e.icon = icon(x.shortForecast); } } });

}

async function pushOn(){

    const kr = await fetch('/import/key.json', { cache: 'no-store' }); if(!kr.ok) throw new Error('the import files aren’t on this site');
    const kj = await kr.json();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: Uint8Array.from(atob(kj.salt), c => c.charCodeAt(0)), iterations: kj.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const open = async url => { const b = new Uint8Array(await (await fetch(url, { cache: 'no-store' })).arrayBuffer()); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12)); };
    let dump; try{ dump = JSON.parse(new TextDecoder().decode(await open('/import/data.bin'))); }catch(e){ S.importMsg = 'That code didn’t work. Check it and try again.'; S.importBusy = false; render(); return; }
    const rows = [];
    Object.entries(dump.collections || {}).forEach(([c, docs]) => Object.entries(docs).forEach(([id, data]) => rows.push({ col: c, id, data })));
    for(let i = 0; i < rows.length; i += 300){ const { error } = await SB.from('docs').upsert(rows.slice(i, i + 300)); if(error) throw error; S.importMsg = `Saving records… ${Math.min(i + 300, rows.length)} of ${rows.length}`; render(); }
    const photos = dump.photos || []; let n = 0;
    for(const p of photos){
      const bl = new Blob([await open('/import/photos/' + p.file)], { type: p.type });
      const { error } = await SB.storage.from('photos').upload(p.id, bl, { contentType: p.type, upsert: true, cacheControl: '31536000' });
      if(error && !/exist/i.test(error.message || '')) throw error;
      n++; S.importMsg = `Moving photos… ${n} of ${photos.length}`; render();
    }
    await setDoc('meta/imported', { at: Date.now(), records: rows.length, photos: photos.length, by: S.me || '' });
    await S.db.loadAll(); S.importMsg = ''; toast(`Moved ${rows.length} records and ${photos.length} photos ✓`); celebrate();
  }catch(e){ console.warn('import', e); S.importMsg = 'Couldn’t finish: ' + ((e && e.message) || e) + '. Tap Import again; it picks up safely.'; }
  S.importBusy = false; render();
}

  /* ---------- patterns ---------- */
  function pattern(k, col, x0, y0, w, h){
    const C = col || 'rgba(255,255,255,.8)', out = [];
    const grid = (dx, dy, fn) => { let r = 0; for(let y = y0 + 2; y < y0 + h; y += dy, r++) for(let x = x0 + (r % 2 ? dx / 2 : 0); x < x0 + w; x += dx) out.push(fn(x, y)); };
    if(k === 'stripes') for(let y = y0 + 3; y < y0 + h; y += 6) out.push(`<rect x="${x0}" y="${f(y)}" width="${w}" height="2.6" fill="${C}" opacity=".55"/>`);
    else if(k === 'pinstripe') for(let x = x0; x < x0 + w; x += 3.4) out.push(`<rect x="${f(x)}" y="${y0}" width=".5" height="${h}" fill="${C}" opacity=".6"/>`);
    else if(k === 'dots') grid(7, 7, (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="1.5" fill="${C}" opacity=".7"/>`);
    else if(k === 'hearts') grid(9, 9, (x, y) => `<path transform="translate(${f(x)} ${f(y)}) scale(.36)" d="M0 6C-6 1-8-3-5-6s5-1 5 1c0-2 2-4 5-1s1 7-5 12z" fill="${C}" opacity=".85"/>`);
    else if(k === 'stars') grid(9, 9, (x, y) => `<path transform="translate(${f(x)} ${f(y)}) scale(.46)" d="M0-5l1.5 3.3L5-1.5 2.4 1l.7 3.6L0 3 -3.1 4.6l.7-3.6L-5-1.5l3.5-.2z" fill="${C}" opacity=".9"/>`);
    else if(k === 'snow') grid(9, 9, (x, y) => `<path transform="translate(${f(x)} ${f(y)})" d="M-2.4 0h4.8M0-2.4v4.8M-1.7-1.7l3.4 3.4M-1.7 1.7l3.4-3.4" stroke="${C}" stroke-width=".8"/>`);
    else if(k === 'leaves') grid(8, 8, (x, y) => `<ellipse cx="${f(x)}" cy="${f(y)}" rx="2.6" ry="1.4" transform="rotate(35 ${f(x)} ${f(y)})" fill="${['#F2C14E','#F28C38','#C9473D'][Math.round(x + y) % 3]}"/>`);
    else if(k === 'floral') grid(10, 9, (x, y) => `<g transform="translate(${f(x)} ${f(y)})">${[0, 72, 144, 216, 288].map(a => `<circle cx="${f(Math.cos(a * Math.PI / 180) * 1.7)}" cy="${f(Math.sin(a * Math.PI / 180) * 1.7)}" r="1.3" fill="${C}" opacity=".85"/>`).join('')}<circle r=".9" fill="#F2C14E"/></g>`);
    else if(k === 'plaid'){ for(let x = x0; x < x0 + w; x += 8) out.push(`<rect x="${f(x)}" y="${y0}" width="3.2" height="${h}" fill="${C}" opacity=".32"/>`); for(let y = y0; y < y0 + h; y += 8) out.push(`<rect x="${x0}" y="${f(y)}" width="${w}" height="3.2" fill="${C}" opacity=".32"/><rect x="${x0}" y="${f(y + 5.4)}" width="${w}" height=".6" fill="#000" opacity=".25"/>`); }
    else if(k === 'camo') grid(11, 9, (x, y) => `<path transform="translate(${f(x)} ${f(y)}) rotate(${Math.round(x * 7 + y * 3) % 180})" d="M-4 0Q-3-3 0-2.4T4 0Q3 3 0 2.4T-4 0Z" fill="${['#3E5A34','#6B7B4B','#2E3A26'][Math.round(x + y) % 3]}" opacity=".85"/>`);
    else if(k === 'tiedye') [['#F28C38',0],['#E0566B',1],['#9B6BD0',2],['#3E6E8E',3],['#4F8761',4]].forEach(([cc, i]) => out.push(`<circle cx="50" cy="${f(y0 + h * .35)}" r="${f(26 - i * 5)}" fill="none" stroke="${cc}" stroke-width="2.8" opacity=".55"/>`));
    else if(k === 'maple') out.push(`<path transform="translate(50 ${f(y0 + 16)}) scale(.8)" d="M0-9l2 4 3-1-1 5 4-2-1 3 3 1-6 4 1 2-4-1v5h-2v-5l-4 1 1-2-6-4 3-1-1-3 4 2-1-5 3 1z" fill="#FFFFFF"/>`);
    else if(k === 'colombia') out.push(`<rect x="${x0}" y="${y0}" width="${w}" height="${f(h * .5)}" fill="#FCD116"/><rect x="${x0}" y="${f(y0 + h * .5)}" width="${w}" height="${f(h * .25)}" fill="#003893"/><rect x="${x0}" y="${f(y0 + h * .75)}" width="${w}" height="${f(h * .25)}" fill="#CE1126"/>`);
    else if(k === 'cross') out.push(`<path d="M50 ${f(y0 + 9)}v13M45.4 ${f(y0 + 13.4)}h9.2" stroke="${C}" stroke-width="2.2" stroke-linecap="round"/>`);
    else if(k === 'heart1') out.push(`<path transform="translate(${f(50 + 6)} ${f(y0 + 12)}) scale(.62)" d="M0 6C-6 1-8-3-5-6s5-1 5 1c0-2 2-4 5-1s1 7-5 12z" fill="${C}"/>`);

  /* ---------- the figure ---------- */
  function figure(c, o){
    TOYM = c.look !== 'detailed'; const TOY = TOYM;
    const u = 'a2' + (++UID), K = c.skin || '#E3B08C', H = c.hair || '#3A281E', A = c.accent || '#E0566B';
    const KO = dk(K, .3), KS = mix(K, '#8C3B28', .2), KL = lt(K, .3);
    const hd = HEADS[c.face] || HEADS.oval, headD = cr(headPts(hd), true, hd[7]);
    const hsx = hd[2] / 21.5, hscale = g => hsx === 1 ? g : `<g transform="translate(50 0) scale(${f(hsx)} 1) translate(-50 0)">${g}</g>`;
    const face = !!o.face;
    const B = BUILDS[c.build] || BUILDS.regular, sw = B[0], ww = B[1], hw = B[2], aw = B[3] * 1.22;
    const LL = { short:33, regular:39, tall:45 }[c.height] || 39;

    const hairPaint = s => HF === H ? s : s.replace(new RegExp(`fill="${H}"`, 'g'), `fill="${HF}"`);
    const hairOver = fx === 'highlights' ? ln('M38 20Q35 28 34.6 36M45 17.6Q43 26 42 33M56 17.6Q58 26 59 33M63 20Q66 28 66.4 36', H2, 1.8, 'opacity=".85"')
      : fx === 'streak' ? ln('M44 16.6Q41 25 39 34', H2, 4.2, 'opacity=".95"') : '';
    const tieFix = x => x.replace(/var\(--avA,#E0566B\)/g, A);
    const backHair = hijab ? '' : (HS[0] ? hscale(tieFix(hairPaint(HS[0](H)))) : '');
    const frontHair = hijab ? '' : hscale(tieFix(hairPaint(HS[1](H))) + (hairK !== 'bald' && !['afro','curly','longcurly','curls','twists','locs'].includes(hairK) ? hairOver : '') + (HS[2] === 'm' && !TOYM ? sh(burns, H, ol(H), .5) + `<g transform="${MIR}">${sh(burns, H, ol(H), .5)}</g>` : ''));
    const accVar = `style="--avA:${A}"`;

    /* features tuning */
    const ES = { s:.86, m:1, l:1.16 }[c.eyesize] || 1, EG = { close:-1.8, mid:0, wide:2 }[c.eyegap] || 0, EY = { up:-2, mid:0, down:2 }[c.eyey] || 0;

    const ex = 9 + EG, ey = 48 + EY;

  /* ---------- backdrops ---------- */
  function bgPattern(k, x0, y0, w, h){
    const out = [], C = 'rgba(255,255,255,.55)';
    const grid = (dx, dy, fn) => { let r = 0; for(let y = y0 + 4; y < y0 + h; y += dy, r++) for(let x = x0 + (r % 2 ? dx / 2 : 0); x < x0 + w; x += dx) out.push(fn(x, y)); };
    if(k === 'dots') grid(12, 12, (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="1.8" fill="${C}"/>`);
    else if(k === 'hearts') grid(16, 15, (x, y) => `<path transform="translate(${f(x)} ${f(y)}) scale(.5)" d="M0 6C-6 1-8-3-5-6s5-1 5 1c0-2 2-4 5-1s1 7-5 12z" fill="${C}"/>`);
    else if(k === 'stars') grid(16, 15, (x, y) => `<path transform="translate(${f(x)} ${f(y)}) scale(.55)" d="M0-5l1.5 3.3L5-1.5 2.4 1l.7 3.6L0 3 -3.1 4.6l.7-3.6L-5-1.5l3.5-.2z" fill="${C}"/>`);
    else if(k === 'stripes') for(let x = x0 - h; x < x0 + w; x += 14) out.push(`<path d="M${f(x)} ${f(y0 + h)}L${f(x + h)} ${y0}" stroke="${C}" stroke-width="4.6" opacity=".7"/>`);
    else if(k === 'sunburst') for(let i = 0; i < 18; i++){ const a = i * 20 * Math.PI / 180, a2 = a + 10 * Math.PI / 180, R = 260; out.push(`<path d="M50 60L${f(50 + Math.cos(a) * R)} ${f(60 + Math.sin(a) * R)}L${f(50 + Math.cos(a2) * R)} ${f(60 + Math.sin(a2) * R)}Z" fill="rgba(255,255,255,.28)"/>`); }
    else if(k === 'confetti') grid(13, 11, (x, y) => `<rect x="${f(x)}" y="${f(y)}" width="3" height="1.4" rx=".6" transform="rotate(${Math.round(x * 13 + y * 7) % 180} ${f(x)} ${f(y)})" fill="${['#E0566B','#F2C14E','#3E6E8E','#4F8761','#9B6BD0'][Math.round(x + y * 3) % 5]}" opacity=".8"/>`);
    return out.join('');
  }

  /* ---------- public: avatar svg ---------- */
  function svg(c, size, mode){
    mode = mode || {};
    if(mode.full){
      const fg = figure(c, {});
      let vb = mode.vb;
      if(!vb){ const x0 = -16, y0 = -6, W = 132, Hh = fg.F + 8 - y0; vb = [x0, y0, W, Hh]; }
      const [x0, y0, W, Hh] = vb, wpx = size || 120;
      const bg = mode.bare ? '' : `<rect x="${x0}" y="${y0}" width="${W}" height="${Hh}" fill="${c.bg || '#D3E5EF'}"/>${bgPattern(c.bgpat || 'solid', x0, y0, W, Hh)}<ellipse cx="50" cy="${f(fg.F + 2)}" rx="70" ry="12" fill="rgba(255,255,255,.42)"/>`;
      const shadow = `<ellipse cx="50" cy="${f(fg.F)}" rx="${f(fg.hw + 12)}" ry="3.4" fill="rgba(0,0,0,.16)"/>`;
      let content = fg.content;
      if(mode.anim && (c.pose === 'wave')){ /* gentle wave via whole-figure sway */ content = `<g>${content}</g>`; }
      return `<svg class="av av-full" width="${f(wpx)}" height="${f(wpx * Hh / W)}" viewBox="${vb.map(f).join(' ')}" aria-hidden="true"><defs>${fg.defs}</defs>${bg}${shadow}${content}</svg>`;
    }
    const fg = figure(c, { face:true }), id = 'a2c' + (++UID), s = size || 40;
    const vb = mode.vb || [7, 8, 86, 86];
    const pet = c.pet === 'dayla' ? dayla(vb[0] + vb[2] * .84, vb[1] + vb[3] + 2, .52) : '';
    return `<svg class="av" width="${s}" height="${s}" viewBox="${vb.map(f).join(' ')}" aria-hidden="true"><defs>${fg.defs}<clipPath id="${id}"><circle cx="${f(vb[0] + vb[2] / 2)}" cy="${f(vb[1] + vb[3] / 2)}" r="${f(vb[2] / 2)}"/></clipPath></defs><g clip-path="url(#${id})"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="${c.bg || '#D3E5EF'}"/>${bgPattern(c.bgpat || 'solid', vb[0], vb[1], vb[2], vb[3])}${fg.content}${mode.noPet ? '' : pet}</g></svg>`;
  }

function marriage(){
  const t = new Date(), tn = dayNum(t);
  const days = tn - dayNum(WEDDING);
  let next = new Date(t.getFullYear(), 11, 20);
  if(dayNum(next) < tn) next = new Date(t.getFullYear() + 1, 11, 20);
  const until = dayNum(next) - tn, yearNo = next.getFullYear() - 2025;
  const prev = new Date(next.getFullYear() - 1, 11, 20);
  const frac = until === 0 ? 1 : (tn - dayNum(prev)) / (dayNum(next) - dayNum(prev));
  return { days, until, yearNo, next, frac };
}
const nthWd = (y, m, wd, n) => { const f = new Date(y, m, 1).getDay(); return new Date(y, m, 1 + mod(wd - f, 7) + 7 * (n - 1)); };

function easter(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
const HOL = {};
function holidays(y){
  const key = y + (S.canada ? 'c' : '');
  if(HOL[key]) return HOL[key];
  const out = {}, add = (d, n) => { const k = ymd(d); (out[k] = out[k] || []).push(n); };
  const F = (m, d, n) => add(new Date(y, m, d), n);
  F(0, 1, "New Year's Day"); F(1, 14, "Valentine's Day"); F(2, 17, "St. Patrick's Day"); F(5, 19, 'Juneteenth'); F(6, 4, 'Independence Day');
  F(9, 31, 'Halloween'); F(10, 11, 'Veterans Day'); F(11, 24, 'Christmas Eve'); F(11, 25, 'Christmas Day'); F(11, 31, "New Year's Eve");
  add(nthWd(y, 0, 1, 3), 'Martin Luther King Jr. Day'); add(nthWd(y, 1, 1, 3), "Presidents' Day"); add(nthWd(y, 2, 0, 2), 'Daylight saving starts (clocks forward)');

  add(nthWd(y, 9, 1, 2), 'Columbus Day'); add(nthWd(y, 10, 0, 1), 'Daylight saving ends (clocks back)'); add(nthWd(y, 10, 4, 4), 'Thanksgiving');
  add(addDays(nthWd(y, 10, 4, 4), 1), 'Black Friday');
  const E = easter(y); add(addDays(E, -46), 'Ash Wednesday'); add(addDays(E, -7), 'Palm Sunday'); add(addDays(E, -2), 'Good Friday'); add(E, 'Easter Sunday');
  if(S.canada){ F(6, 1, 'Canada Day'); add(nthWd(y, 9, 1, 2), 'Canadian Thanksgiving'); }
  return HOL[key] = out;
}

function occurs(e, d){
  if(!e.date) return false;
  const s = parseYmd(e.date);
  if(dayNum(d) < dayNum(s)) return false;
  switch(e.repeat){
    case 'yearly': return d.getMonth() === s.getMonth() && d.getDate() === Math.min(s.getDate(), daysIn(d.getFullYear(), d.getMonth()));
    case 'monthly': return d.getDate() === Math.min(s.getDate(), daysIn(d.getFullYear(), d.getMonth()));
    case 'weekly': return d.getDay() === s.getDay();
    default: return ymd(d) === e.date;
  }
}
function nextOcc(e, from){ for(let i = 0; i < 400; i++){ const d = addDays(from, i); if(occurs(e, d)) return d; } return null; }
function evTitle(e, d){
  if(e.repeat === 'yearly'){
    const n = d.getFullYear() - parseYmd(e.date).getFullYear();
    if(e.cat === 'Birthday' && n > 0) return `${e.title} · turns ${n}`;
    if(e.cat === 'Anniversary' && n > 0) return `${e.title} · ${ordinal(n)}`;

}

/* walk a pool in a shuffled order so nothing repeats until every line has been used */
function dPick(arr, n, salt){
  const L = arr.length; if(!L) return ''; const cyc = Math.floor(n / L), i = mod(n, L);

  return arr[idx[i]];
}

  const who = S.me ? PEOPLE[S.me].role : 'Mom and Dad';
  const me = S.me || 'both', mine = PERSONAL.concat(DAYLA_MORE_ME).filter(x => x[0] === 'both' || x[0] === me).map(x => x[1]);
  const big = NEEDS.concat(DAYLA_MORE, mine);
  let need = dPick(big, n, me === 'laura' ? 2 : me === 'david' ? 1 : 3), go = null, label = '';
  // sprinkle in the day of the week, the season and the time of day
  const r = dSeed(n * 13 + 7);

  else if(r < .22) need = DAYLA_SEASON[d.getMonth()];
  else if(today && r < .34){ const slot = h < 11 && h >= 5 ? 'morning' : h >= 17 && h < 21 ? 'evening' : h >= 21 || h < 5 ? 'night' : ''; if(slot) need = dPick(DAYLA_TIME[slot], n, 5); }
  // what's actually happening today wins most days
  if(today){ const ctx = daylaToday(); if(ctx.length && (ctx[0].p >= 7 || dSeed(n * 29 + 1) < .6)){ const c = ctx[0].p >= 7 ? ctx[0] : ctx[Math.floor(dSeed(n * 31) * Math.min(3, ctx.length))]; need = c.text; go = c.go || null; label = c.label || ''; } }
  const bw = Object.keys(BIRTHDAYS).find(w => { const b = parseYmd(BIRTHDAYS[w]); return b.getMonth() === d.getMonth() && b.getDate() === d.getDate(); });
  const db = parseYmd(DAYLA_BDAY);
  const special = s2 => { need = s2; go = null; label = ''; };
  if(d.getMonth() === db.getMonth() && d.getDate() === db.getDate() && d.getFullYear() > db.getFullYear()){ const age = d.getFullYear() - db.getFullYear(); special(`IT'S MY BIRTHDAY! I'm ${age} today. I expect cake (the dog-safe kind), a new squeaky toy and belly rubs all day long.`); }
  else if(bw){ const age = d.getFullYear() - parseYmd(BIRTHDAYS[bw]).getFullYear(); special(bw === S.me ? `HAPPY BIRTHDAY! You're ${age} today and I'm the best present you'll get. Birthday zoomies at 5pm.` : `It's ${nameOf(bw)}'s birthday! ${nameOf(bw)} turns ${age} today. I'm giving extra kisses and you should too.`); }
  else if(d.getMonth() === 0 && d.getDate() === 31 && d.getFullYear() > 2026){ const yrs = d.getFullYear() - 2026; special(`HAPPY GOTCHA DAY! ${yrs === 1 ? 'One year' : yrs + ' years'} ago today you brought me home. Best day of my life. I'd like to celebrate with chicken. And maybe a shoe.`); }
  else if(d.getMonth() === 11 && d.getDate() === 20) special(`Happy ${ordinal(d.getFullYear() - 2025)} anniversary! I'm wearing my fanciest collar. Extra treats for everyone, especially me.`);
  else if(d.getMonth() === 11 && d.getDate() === 25) special(`MERRY CHRISTMAS! Happy birthday, Jesus! I hope there's a present under the tree that squeaks.`);
  else if(d.getDate() === 20 && dayNum(d) > dayNum(WEDDING)){ const mo = (d.getFullYear() - 2025) * 12 + (d.getMonth() - 11); special(`Happy ${mo}-month anniversary! The rule today is extra cuddles. I made the rule.`); }

function billDue(b, ref){
  const r = ref || new Date();
  const day = Math.min(Math.max(1, Number(b.due) || 1), daysIn(r.getFullYear(), r.getMonth()));
  return new Date(r.getFullYear(), r.getMonth(), day);
}
function billStatus(b){
  const t = new Date(), mk = monthKey(t);
  const paid = (b.paid || []).includes(mk);
  const diff = dayNum(billDue(b, t)) - dayNum(t);
  if(paid) return { cls:'sage', label:'Paid', diff, paid:true };
  if(b.auto) return { cls:'cocoa', label: diff > 0 ? `Autopay in ${diff}d` : diff === 0 ? 'Autopay today' : 'Autopay', diff, paid:false };
  if(diff < 0) return { cls:'blush', label:`${-diff}d late`, diff, paid:false };
  if(diff === 0) return { cls:'gold', label:'Due today', diff, paid:false };
  return { cls: diff <= 5 ? 'gold' : '', label:`Due in ${diff}d`, diff, paid:false };
}

function upcomingCard(){

  if(!up.length && !hol.length) return '';
  const rows = up.map(([e, d]) => [d, `<div class="li"><span class="pill">${esc(fmtDate(d, { month:'short', day:'numeric' }))}</span><div class="txt">${esc(evTitle(e, d))}<div class="sub">${esc(fmtTime(e.time) || e.cat || 'All day')}${e.repeat && e.repeat !== 'none' ? ' · repeats' : ''}</div></div></div>`])

    .sort((a, b) => a[0] - b[0]).map(x => x[1]).join('');
  return `<section class="card"><h2>Coming up</h2><div class="list" style="margin-top:4px">${rows}</div></section>`;
}

function drawWheel(){
  const cv = document.getElementById('wheel'); if(!cv) return;
  const ctx = cv.getContext('2d'), cs = getComputedStyle(document.documentElement);
  const col = n => cs.getPropertyValue(n).trim();
  const fills = [col('--blush-soft'), col('--cocoa-soft'), col('--sage-soft'), col('--gold-soft')];
  const items = S.wheel.items, n = items.length || 1, W = cv.width, R = W / 2 - 6, cx = W / 2;
  ctx.clearRect(0, 0, W, W);
  ctx.save(); ctx.translate(cx, cx); ctx.rotate(S.wheel.angle);
  for(let i = 0; i < n; i++){
    const a0 = i * 2 * Math.PI / n - Math.PI / 2, a1 = a0 + 2 * Math.PI / n;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a1); ctx.closePath();
    ctx.fillStyle = fills[i % 4]; ctx.fill(); ctx.strokeStyle = col('--surface'); ctx.lineWidth = 4; ctx.stroke();
    ctx.save(); ctx.rotate((a0 + a1) / 2); ctx.fillStyle = col('--ink'); ctx.font = '600 22px Figtree, system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let t = items[i] ? items[i].t : ''; if(t.length > 24) t = t.slice(0, 23) + '…';
    ctx.fillText(t, R - 18, 0); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, 2 * Math.PI); ctx.fillStyle = col('--surface'); ctx.fill();
  ctx.fillStyle = col('--blush'); ctx.font = '700 30px Fredoka, system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('♥', 0, 2);
  ctx.restore();
}
function spin(){
  if(S.wheel.spinning || !S.wheel.items.length) return;
  const n = S.wheel.items.length, idx = Math.floor(Math.random() * n), sg = 2 * Math.PI / n;
  const target = -(idx * sg + sg / 2) + (Math.random() - .5) * sg * .6;
  const startA = S.wheel.angle, end = startA + 2 * Math.PI * 6 + mod(target - startA, 2 * Math.PI);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 1 : 3800, t0 = performance.now();
  S.wheel.spinning = true; S.wheel.result = null; render();
  const step = t => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    S.wheel.angle = startA + (end - startA) * e; drawWheel();
    { const seg = Math.floor(S.wheel.angle / sg); if(seg !== S.wheel.lastSeg){ S.wheel.lastSeg = seg; SFX.play('tick'); } }
    if(p < 1) requestAnimationFrame(step);
    else { S.wheel.angle = mod(end, 2 * Math.PI); S.wheel.spinning = false; S.wheel.result = S.wheel.items[idx]; render(); celebrate(); }
  };
  requestAnimationFrame(step);
}

const U = () => SET.unit || 'lb';
function weekStart(){ const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - mod(d.getDay() - SET.weekStart, 7)); return d; }
function weekLogs(w){ const ws = ymd(weekStart()); return S.data.logs.filter(l => l.who === w && l.date >= ws); }
function streak(w){
  const days = new Set(S.data.logs.filter(l => l.who === w).map(l => l.date));
  let d = new Date(), n = 0;
  if(!days.has(ymd(d))) d = addDays(d, -1);
  while(days.has(ymd(d))){ n++; d = addDays(d, -1); }
  return n;
}

    const m = line.match(/^(.+?)\s*[–—-]\s*(\d+)\s*[×x]\s*(.+)$/);
    return m ? { n: m[1].trim(), s: m[2], r: m[3].trim(), w: '' } : { n: line, s: '', r: '', w: '' };
