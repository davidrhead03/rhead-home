# Uploads the Teller certificate to Cloudflare so the bank sync can use it.
# Run from GitHub: Actions > "Upload Teller certificate" > Run workflow.
# Needs repo secrets: TELLER_CERT, TELLER_KEY (the two .pem files' text) and CF_API_TOKEN.
name: Upload Teller certificate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload to Cloudflare
        env:
          CERT: ${{ secrets.TELLER_CERT }}
          KEY: ${{ secrets.TELLER_KEY }}
          TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT: 8455ebeb7cbca771c2266ae71f97c88c
        run: |
          for v in CERT KEY TOKEN; do [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }; done
          case "$CERT" in *"BEGIN CERTIFICATE"*) ;; *) echo "::error::TELLER_CERT should be the text of certificate.pem"; exit 1;; esac
          case "$KEY" in *"PRIVATE KEY"*) ;; *) echo "::error::TELLER_KEY should be the text of private_key.pem"; exit 1;; esac
          body=$(jq -n --arg c "$CERT" --arg k "$KEY" '{ca:false, certificates:$c, private_key:$k, name:("teller-" + (now|floor|tostring))}')
          r=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/mtls_certificates" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$body")
          if [ "$(echo "$r" | jq -r .success)" != "true" ]; then echo "::error::Cloudflare said: $(echo "$r" | jq -c .errors)"; exit 1; fi
          id=$(echo "$r" | jq -r .result.id)
          echo "CERTIFICATE_ID=$id"
          echo "### ✅ Uploaded. Certificate ID: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
